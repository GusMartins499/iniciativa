name: Deploy

# O único caminho para publicar (o deploy automático da Vercel está desligado no vercel.json).
# Roda quando o CI de um push termina verde: staging → preview em iniciativa-tea-staging.vercel.app,
# main → produção. A migração do banco vem antes do deploy, e erro nela interrompe tudo.
# Com o deploy verde, o job release gera a versão e a GitHub Release do que foi ao ar.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

# Um deploy por ambiente de cada vez, sem cancelar o que já está migrando o banco.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migração e deploy (${{ github.event.workflow_run.head_branch }})
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cada environment do GitHub guarda o DATABASE_URL do seu banco no Neon.
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      PRODUCTION: ${{ github.event.workflow_run.head_branch == 'main' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL: pnpm dlx vercel@48.8.2
      STAGING_ALIAS: iniciativa-tea-staging.vercel.app
      PRODUCTION_URL: https://iniciativa-tea.vercel.app
    steps:
      # O commit exato que passou no CI, não a ponta da branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Migrações são aditivas (GUIDELINES.md § Data & migrations): o código que está no ar
      # continua funcionando com o schema novo enquanto o deploy acontece.
      - name: Aplica as migrações
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Confere que nenhuma migração ficou pendente
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build na Vercel
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
            $VERCEL build --prod --token="$VERCEL_TOKEN"
          else
            $VERCEL pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
            $VERCEL build --token="$VERCEL_TOKEN"
          fi

      - name: Publica
        id: publish
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            url=$($VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$($VERCEL deploy --prebuilt --token="$VERCEL_TOKEN")
            $VERCEL alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Só confere que o app subiu com as variáveis do ambiente. Quem barra migração
      # faltando é o db:check acima. O preview fica atrás da proteção da Vercel, então
      # isto só roda na produção.
      - name: Smoke test da produção
        if: env.PRODUCTION == 'true'
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/")
          echo "/ → $status"
          [ "$status" = "200" ] || exit 1

  # Versão e changelog (GUIDELINES.md § Release). Só roda depois do deploy verde, então a tag
  # quer dizer "isto está no ar": staging → vX.Y.Z-rc.N (Pre-release), main → vX.Y.Z (Latest).
  release:
    name: Versão e changelog (${{ github.event.workflow_run.head_branch }})
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag, GitHub Release e o back-merge na staging
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # O semantic-release precisa estar na branch (não em detached HEAD), com o histórico e as tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # Se a branch andou depois do commit publicado, o deploy do commit mais novo gera a versão
      # e leva estes commits junto. Versionar a ponta aqui marcaria código que ainda não está no ar.
      - name: Confere que a branch está no commit publicado
        id: head
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH já passou de $HEAD_SHA; o próximo deploy gera a versão."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.head.outputs.current == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version: 26
          cache: pnpm

      - if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      # No workflow_run, GITHUB_REF e GITHUB_SHA apontam para a branch default, e é deles que o
      # semantic-release tira a branch. Sem a troca, todo release da staging sairia como da main.
      - name: Gera a versão e a GitHub Release
        if: steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GITHUB_REF="refs/heads/$BRANCH" GITHUB_SHA="$HEAD_SHA" pnpm exec semantic-release

      # A tag da main fica no merge commit do release, que a staging não tem. Sem trazê-lo de volta,
      # a staging não enxerga a vX.Y.Z e solta outra rc da versão que já saiu. O merge do release
      # não muda arquivo, então nunca há conflito. Push com GITHUB_TOKEN não dispara CI nem deploy.
      - name: Traz o release da main de volta para a staging
        if: steps.head.outputs.current == 'true' && env.BRANCH == 'main'
        run: |
          git fetch origin staging
          if git merge-base --is-ancestor HEAD origin/staging; then
            echo "A staging já contém a main."
          elif git merge-base --is-ancestor origin/staging HEAD; then
            git push origin HEAD:staging
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c staging origin/staging
            git merge --no-ff "$HEAD_SHA" -m "chore(release): traz a main de volta para a staging"
            git push origin staging
          fi
