name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior. Na main não: cada merge
# precisa terminar com o próprio resultado de CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Usa a versão do pnpm fixada em "packageManager" no package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Sem TEST_DATABASE_URL o teste de concorrência é pulado: ele apaga o schema da
      # branch "test" do Neon, e PRs rodando em paralelo atropelariam um ao outro.
      - run: pnpm test
      # O build não precisa de segredos: o env.ts só valida as variáveis quando o código as lê.
      - run: pnpm build

  e2e:
    name: Testes e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Postgres descartável atrás do wsproxy do Neon, o mesmo compose da máquina local.
      # Nenhum segredo do repositório: o playwright.config.ts gera o BETTER_AUTH_SECRET e usa
      # credenciais falsas do Google, então o job roda também em PRs de fork.
      - run: pnpm e2e:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
